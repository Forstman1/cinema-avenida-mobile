<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>S'inscrire - Cinéma Avenida</title>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#474746",
                    "on-tertiary-container": "#b1daff",
                    "secondary-container": "#474746",
                    "outline-variant": "#5a403e",
                    "error": "#ffb4ab",

                    "on-error": "#690005",
                    "surface-container": "#201f1f",
                    "on-surface-variant": "#e2beba",
                    "on-primary-fixed-variant": "#92030f",
                    "primary-fixed-dim": "#ffb4ac",
                    "tertiary-fixed-dim": "#8fcdff",
                    "on-secondary": "#313030",
                    "tertiary-container": "#006292",
                    "primary-fixed": "#ffdad6",
                    "outline": "#aa8986",
                    "on-primary": "#690007",
                    "inverse-surface": "#e5e2e1",
                    "on-error-container": "#ffdad6",
                    "on-background": "#e5e2e1",
                    "inverse-primary": "#b52424",
                    "surface-container-high": "#2a2a2a",
                    "on-secondary-container": "#b7b5b4",
                    "surface": "#131313",
                    "on-surface": "#e5e2e1",
                    "primary-container": "#b22222",
                    "surface-container-low": "#1c1b1b",
                    "surface-container-highest": "#353534",
                    "on-tertiary-fixed-variant": "#004b71",
                    "secondary-fixed-dim": "#c8c6c5",
                    "tertiary": "#8fcdff",
                    "surface-tint": "#ffb4ac",
                    "primary": "#ffb4ac",
                    "surface-container-lowest": "#0e0e0e",
                    "error-container": "#93000a",
                    "on-primary-container": "#ffc8c2",
                    "surface-bright": "#3a3939",
                    "on-primary-fixed": "#410003",
                    "on-tertiary": "#003450",
                    "background": "#131313",
                    "secondary": "#c8c6c5",
                    "on-tertiary-fixed": "#001e30",
                    "surface-dim": "#131313",
                    "inverse-on-surface": "#313030",
                    "surface-variant": "#353534",

                    "tertiary-fixed": "#cbe6ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "unit": "4px",
                    "xs": "4px",
                    "xl": "32px",
                    "margin": "20px",
                    "md": "16px",
                    "gutter": "16px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "display-lg": ["EB Garamond"],
                    "headline-md": ["EB Garamond"],
                    "headline-lg": ["EB Garamond"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-lg-mobile": ["EB Garamond"],
                    "headline-sm": ["EB Garamond"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["42px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "38px", "fontWeight": "500"}],

                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "500"}],

                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle background noise for cinematic feel */
        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden bg-noise flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-white">
<!-- Full Bleed Background Image with Gradient Fade -->
<div class="absolute top-0 left-0 w-full h-[60vh] z-0 pointer-events-none">
<img alt="Cinematic background" class="w-full h-full object-cover object-top" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9mh45j-tMZtF5ktMvw8P4Goz1ZdCSVCYrue0LkBd39AIbmu8h0Mn7ZF26RTEPv94ZuBg8uOSyoaP7B2un_GysUlB2eAEsUFn7OFxvcBQuqaQXWK7TdLZtywzu9FKm17oLQOUq9Me235GUsfMe1m8KPqUj0KUFLEMcpilGKT3HIPZoU3M5S_jXFj_tXZOGE-aNoFIo130IzBIxAc2Vaq32HvP8lD7RCtskPfmr3oK0lYOpzyUz7HooVQ"/>
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-background/80 to-background"></div>
</div>
<!-- Header -->
<header class="w-full flex items-center justify-between px-margin py-sm z-50 fixed top-0 bg-transparent">
<a class="flex items-center text-on-surface-variant hover:text-primary transition-colors p-sm -ml-sm drop-shadow-md" href="#">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</a>
<!-- Empty div to balance flex-between -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin pt-xl pb-xl z-10 w-full max-w-md mx-auto relative mt-16 md:mt-0">
<!-- Branding / Hero -->
<div class="text-center mb-xl w-full relative z-10 drop-shadow-lg">
<h1 class="font-display-lg text-display-lg text-on-surface font-bold tracking-tight mb-sm">Cinéma Avenida</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Rejoignez le club des cinéphiles.</p>
</div>
<!-- Form Card (Glassmorphism) -->
<div class="w-full bg-surface/60 backdrop-blur-lg rounded-[16px] border border-white/5 p-lg shadow-2xl relative overflow-hidden">
<!-- Subtle highlight line top of card -->
<div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<form action="#" class="space-y-xl mt-sm" method="POST">
<!-- Nom complet -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary-container" for="name">Nom complet</label>
<div class="flex items-center bg-surface-container/80 rounded-lg px-md py-sm border border-transparent focus-within:border-primary-container transition-all">
<span class="material-symbols-outlined text-outline mr-sm text-[20px]" data-icon="person">person</span>
<input class="bg-transparent border-none w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" id="name" name="name" placeholder="Jean Dupont" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary-container" for="email">Email</label>
<div class="flex items-center bg-surface-container/80 rounded-lg px-md py-sm border border-transparent focus-within:border-primary-container transition-all">
<span class="material-symbols-outlined text-outline mr-sm text-[20px]" data-icon="mail">mail</span>
<input class="bg-transparent border-none w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" id="email" name="email" placeholder="jean@exemple.com" required="" type="email"/>
</div>
</div>
<!-- Mot de passe -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary-container" for="password">Mot de passe</label>
<div class="flex items-center bg-surface-container/80 rounded-lg px-md py-sm border border-transparent focus-within:border-primary-container transition-all">
<span class="material-symbols-outlined text-outline mr-sm text-[20px]" data-icon="lock">lock</span>
<input class="bg-transparent border-none w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="text-outline hover:text-on-surface transition-colors ml-sm focus:outline-none flex items-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-white font-body-md text-body-md font-bold py-md rounded-lg shadow-[0_8px_32px_rgba(178,34,34,0.3)] hover:bg-primary-container/90 hover:shadow-[0_8px_32px_rgba(178,34,34,0.5)] transition-all active:scale-[0.98] flex justify-center items-center" type="submit">
                        S'inscrire
                        <span class="material-symbols-outlined ml-sm text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Déjà membre ? 
                    <a class="text-primary-container hover:text-primary transition-colors font-medium ml-xs underline underline-offset-4" href="#">Se connecter</a>
</p>
</div>
</div>
</main>
</body></html>
