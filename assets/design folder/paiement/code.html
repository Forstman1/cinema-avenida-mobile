<!DOCTYPE html><html class="dark" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Paiement - Cinéma Avenida</title>

                        "on-secondary": "#313030",
                        "tertiary-container": "#006292",
                        "primary-fixed": "#ffdad6",
                        "outline": "#aa8986",
                        "on-primary": "#690007",
                        "inverse-surface": "#e5e2e1",
                        "on-error-container": "#ffdad6",
                        "on-background": "#e5e2e1",
                        "inverse-primary": "#b52424",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary-container": "#b7b5b4",

                    },
                    "spacing": {

                        "unit": "4px",
                        "xs": "4px",
                        "xl": "32px",

                        "gutter": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["EB Garamond"],
                        "headline-md": ["EB Garamond"],
                        "headline-lg": ["EB Garamond"],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col pt-[72px]">
<!-- TopAppBar (Suppressed navigation, only back button and title for transactional flow) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-2xl flex items-center px-margin py-sm h-[72px]">
<button aria-label="Retour" class="text-on-surface mr-md active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-on-surface flex-grow text-center pr-10">Paiement</h1>
</header>
<main class="flex-grow px-margin py-xl max-w-md mx-auto w-full flex flex-col gap-xl">
<!-- Summary Card -->
<section class="bg-[#1A1A1A] rounded-[16px] border border-white/5 p-md flex flex-col gap-md relative overflow-hidden">
<!-- Background Blur Element -->
<div class="absolute inset-0 bg-white/5 backdrop-blur-[20px] z-0 pointer-events-none"></div>
<div class="relative z-10 flex gap-md">
<img class="w-[80px] h-[120px] object-cover rounded-lg shadow-md" data-alt="A moody, cinematic poster of a highly anticipated sci-fi thriller featuring a lone astronaut gazing at a monolithic structure on an alien planet. Deep blacks, vivid crimson accents, modern theatrical aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUMYgUms1aLK5iVNytnNroNoPAT7zHPixSbGTu1fnP7Dn_9xkN7Z5TJA6egGffLQyYAhV2JXctbRAYtkh0zUr7CFn-FW37gG9gADWOO5Gcw2PI818BqunIdObed5iiLt3j_JWe3dEhN8NhwFTHKwwPnNRkbcBiivdxyV3e8aIUH-3Xl6QGAuYqwHaj8cYwgLsQ3Yf4jZP0QnAMPvjtpI9tkMgauFOEx73oC7RaqycpOEctuhrYt_APUA">
<div class="flex flex-col justify-center">
<h2 class="text-headline-sm font-headline-sm text-on-surface mb-sm">Dune: Deuxième Partie</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px]">calendar_today</span> 14 Octobre 2023
                     </p>
<p class="text-body-sm font-body-sm text-on-surface-variant flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span> 20:30
                     </p>
<p class="text-body-sm font-body-sm text-on-surface-variant flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px]">chair</span> Sièges: E5, E6
                     </p>
</div>
</div>
<div class="relative z-10 border-t border-white/10 pt-md flex justify-between items-center mt-sm">
<span class="text-body-lg font-body-lg text-on-surface">Total à payer</span>
<span class="text-headline-md font-headline-md font-bold text-primary-container">120 DH</span>
</div>
</section>
<!-- Payment Details -->
<section class="flex flex-col gap-lg">
<h3 class="text-body-lg font-body-lg text-on-surface">Détails de la carte</h3>
<form class="flex flex-col gap-md">
<div class="relative">
<span class="material-symbols-outlined absolute left-0 bottom-2 text-on-surface-variant">credit_card</span>
<input class="w-full bg-transparent border-0 border-b border-white/20 text-on-surface font-body-md py-sm pl-[32px] focus:ring-0 focus:border-primary-container transition-colors" placeholder="Numéro de carte" type="text" value="**** **** **** 4242">
</div>
<div class="flex gap-gutter">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-0 bottom-2 text-on-surface-variant">event</span>
<input class="w-full bg-transparent border-0 border-b border-white/20 text-on-surface font-body-md py-sm pl-[32px] focus:ring-0 focus:border-primary-container transition-colors" placeholder="MM/AA" type="text" value="12/25">
</div>
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-0 bottom-2 text-on-surface-variant">lock</span>
<input class="w-full bg-transparent border-0 border-b border-white/20 text-on-surface font-body-md py-sm pl-[32px] focus:ring-0 focus:border-primary-container transition-colors" placeholder="CVV" type="text" value="***">
</div>
</div>
<div class="relative mt-sm">
<span class="material-symbols-outlined absolute left-0 bottom-2 text-on-surface-variant">person</span>
<input class="w-full bg-transparent border-0 border-b border-white/20 text-on-surface font-body-md py-sm pl-[32px] focus:ring-0 focus:border-primary-container transition-colors" placeholder="Nom sur la carte" type="text" value="Jean Dupont">
</div>
</form>
</section>
<!-- Actions -->
<div class="mt-auto pt-xl flex flex-col gap-md items-center pb-safe">
<button class="w-full bg-primary-container text-white font-body-md font-bold py-[16px] rounded-lg shadow-[0_8px_32px_rgba(0,0,0,0.5)] active:scale-95 transition-transform flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">lock</span>
                Payer 120 DH
            </button>
<p class="text-label-md font-label-md text-on-surface-variant/60 uppercase flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">info</span> Paiement simulé
            </p>
</div>
</main>
</body></html>
