<style>
        body {
            background-color: #0A0A0A; /* Level 0 Base */
            color: #e5e2e1;
        }
        
        .glass-card {
            background-color: #1A1A1A; /* Level 1 Card */
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        .glass-overlay {
            background-color: rgba(255, 255, 255, 0.08); /* Level 2 Overlay */
            backdrop-filter: blur(20px);
        }

        .crimson-border-active {
            border-color: #B22222 !important;
        }

        .crimson-bg-active {
            background-color: #B22222 !important;
        }

        .floating-button {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Prevent scrolling body when bottom nav is present */
        body { padding-bottom: 80px; }

<body class="font-body-md text-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-xl dark:bg-surface/80 text-primary dark:text-primary fixed top-0 w-full z-50 border-b border-white/5 shadow-2xl flex items-center justify-between px-margin py-sm w-full">
<button aria-label="Menu" class="hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">menu</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-on-surface dark:text-on-surface">Cinéma Avenida</h1>
<button aria-label="Search" class="hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">search</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-margin w-full max-w-2xl mx-auto">
<!-- Movie Header Context -->
<div class="mb-xl text-center">
<div class="w-full h-48 rounded-xl overflow-hidden mb-sm relative glass-card" data-alt="A cinematic, ultra-widescreen still of an intense sci-fi epic. A lone figure stands before a massive, glowing monolithic structure in a desolate, dark volcanic landscape. High contrast lighting with deep blacks and stark, glowing crimson accents. Minimalist, premium cinematic aesthetic. 8k resolution." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA8Jci5YhD_ige-_E-tkz2kP3eZKAc0OXVOSA21H0IdHenM7Ei5JDp1J8aGJpxGIOjY_cjNXz0A0vEypxrL58OF8iBQCVNGMe4Y2rEjsyOG7rFiW3qGCPbeiBN8cjVZqeG361Cuh7nLmNstmMrAmXt4T3PNbWaatvTHQlvqhH6UmOuX2x-7rWClFLlDTBpwWmmJo0kWtWpGNwJBP-qZ5_SuiqHENTClKD_Vsjq5z1Pd-tvruNw2P4yJ8A')">
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent opacity-80"></div>
</div>
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface mb-xs">Dune: Deuxième Partie</h2>
<p class="text-on-surface-variant text-body-sm font-body-sm">Sélectionnez une séance pour aujourd'hui</p>
</div>
<!-- Time Slot Selection Grid (Bento/Card Style) -->
<div class="grid grid-cols-1 gap-md">
<!-- Slot 1: 18:00 (Active Example) -->
<button class="glass-card rounded-xl p-md text-left transition-all duration-300 hover:border-primary-container group crimson-border-active relative overflow-hidden" onclick="selectSlot(this)">
<div class="absolute inset-0 bg-primary-container/10 opacity-100 transition-opacity"></div>
<div class="relative z-10 flex justify-between items-center">
<div>
<span class="block text-headline-md font-headline-md text-on-surface mb-xs group-hover:text-primary-container transition-colors">18:00</span>
<span class="block text-body-sm font-body-sm text-primary-container font-medium">87 places disponibles</span>
</div>
<div class="h-10 w-10 rounded-full border-2 border-primary-container flex items-center justify-center bg-primary-container text-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</button>
<!-- Slot 2: 20:30 -->
<button class="glass-card rounded-xl p-md text-left transition-all duration-300 hover:border-primary-container group relative overflow-hidden border-white/5" onclick="selectSlot(this)">
<div class="absolute inset-0 bg-primary-container/0 group-hover:bg-primary-container/5 transition-opacity"></div>
<div class="relative z-10 flex justify-between items-center">
<div>
<span class="block text-headline-md font-headline-md text-on-surface mb-xs group-hover:text-primary-container transition-colors">20:30</span>
<span class="block text-body-sm font-body-sm text-on-surface-variant">42 places disponibles</span>
</div>
<div class="h-10 w-10 rounded-full border-2 border-white/20 flex items-center justify-center text-transparent group-hover:border-primary-container/50 transition-colors">
<span class="material-symbols-outlined">check</span>
</div>
</div>
</button>
<!-- Slot 3: 22:30 -->
<button class="glass-card rounded-xl p-md text-left transition-all duration-300 hover:border-primary-container group relative overflow-hidden border-white/5" onclick="selectSlot(this)">
<div class="absolute inset-0 bg-primary-container/0 group-hover:bg-primary-container/5 transition-opacity"></div>
<div class="relative z-10 flex justify-between items-center">
<div>
<span class="block text-headline-md font-headline-md text-on-surface mb-xs group-hover:text-primary-container transition-colors">22:30</span>
<span class="block text-body-sm font-body-sm text-on-surface-variant">120 places disponibles</span>
</div>
<div class="h-10 w-10 rounded-full border-2 border-white/20 flex items-center justify-center text-transparent group-hover:border-primary-container/50 transition-colors">
<span class="material-symbols-outlined">check</span>
</div>
</div>
</button>
</div>
<!-- Floating Action Button (Contextual: Continue to next step) -->
<div class="mt-xl flex justify-center pb-xl">
<button class="bg-primary-container text-white font-body-md font-bold py-md px-xl rounded-full floating-button hover:bg-inverse-primary transition-colors flex items-center gap-sm">
                Continuer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>

<nav class="bg-surface/80 backdrop-blur-xl dark:bg-surface/80 text-primary dark:text-primary fixed bottom-0 w-full z-50 border-t border-white/5 shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex justify-around items-center h-16 px-margin pb-safe md:hidden">
<!-- Accueil (Active fallback based on JSON, though technically in a booking flow, we might suppress nav. Prompt requested BottomNavBar included) -->
<button class="flex flex-col items-center justify-center text-primary font-bold hover:text-primary/80 transition-colors active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-label-md font-label-md mt-1">Accueil</span>
</button>
<!-- Mes Billets -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90 transition-transform">
<span class="material-symbols-outlined">confirmation_number</span>
<span class="text-label-md font-label-md mt-1">Mes Billets</span>
</button>
<!-- Profil -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90 transition-transform">
<span class="material-symbols-outlined">person</span>
<span class="text-label-md font-label-md mt-1">Profil</span>
</button>
</nav>
<script>
        function selectSlot(element) {
            // Remove active state from all slots
            const slots = document.querySelectorAll('.grid button');
            slots.forEach(slot => {
                slot.classList.remove('crimson-border-active');
                slot.classList.add('border-white/5');
                
                // Reset internal indicator
                const indicator = slot.querySelector('.rounded-full');
                indicator.classList.remove('bg-primary-container', 'border-primary-container', 'text-white');
                indicator.classList.add('border-white/20', 'text-transparent');
                
                // Reset text colors
                const availabilityText = slot.querySelector('.text-body-sm');
                availabilityText.classList.remove('text-primary-container', 'font-medium');
                availabilityText.classList.add('text-on-surface-variant');

                // Reset background overlay
                 const overlay = slot.querySelector('.bg-primary-container\\/10');
                 if(overlay) {
                     overlay.classList.remove('bg-primary-container/10', 'opacity-100');
                     overlay.classList.add('bg-primary-container/0');
                 }
            });

            // Add active state to clicked slot
            element.classList.add('crimson-border-active');
            element.classList.remove('border-white/5');
            
            // Activate internal indicator
            const activeIndicator = element.querySelector('.rounded-full');
            activeIndicator.classList.add('bg-primary-container', 'border-primary-container', 'text-white');
            activeIndicator.classList.remove('border-white/20', 'text-transparent', 'group-hover:border-primary-container/50');
            
            // Activate text colors
            const activeAvailability = element.querySelector('.text-body-sm');
            activeAvailability.classList.add('text-primary-container', 'font-medium');
            activeAvailability.classList.remove('text-on-surface-variant');

            // Activate background overlay
            let overlay = element.querySelector('div:first-child');
            overlay.className = 'absolute inset-0 bg-primary-container/10 opacity-100 transition-opacity';
        }
    </script>
</body></html>
