<!DOCTYPE html><html class="dark" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Ajouter un film</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        body {
            background-color: #0A0A0A; /* Level 0 Base */
            color: #e5e2e1;
        }
        
        .glass-panel {
            background: rgba(26, 26, 26, 0.7); /* Level 1 Base with opacity */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-glass {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .input-glass:focus {
            outline: none;
            border-bottom: 1px solid #b22222;
            box-shadow: 0 1px 0 0 #b22222;
        }

        .poster-upload {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .poster-upload:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.02);
        }

        /* Checkbox Chip Styling */
        .chip-checkbox:checked + label {
            background-color: #b22222;
            color: #ffffff;
            border-color: #b22222;
        }
        
        .floating-btn-shadow {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col pt-20 pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-2xl flex items-center justify-between px-margin py-sm">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-on-surface">Ajouter un film</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow px-margin w-full max-w-4xl mx-auto md:px-lg">
<form class="space-y-xl mt-lg">
<!-- Bento Layout for Form -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Poster Upload (Left Column on Desktop) -->
<div class="md:col-span-4 flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase">Affiche du film</label>
<div class="poster-upload rounded-xl h-64 md:h-full min-h-[300px] flex flex-col items-center justify-center cursor-pointer group relative overflow-hidden bg-surface-container-low">
<div class="z-10 flex flex-col items-center gap-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-4xl" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="text-body-sm font-body-sm">Glisser ou cliquer</span>
</div>
<input accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" type="file">
</div>
</div>
<!-- Main Details (Right Column on Desktop) -->
<div class="md:col-span-8 flex flex-col gap-lg glass-panel p-md md:p-lg rounded-xl">
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="title">Titre du film</label>
<input class="input-glass text-body-lg font-body-lg text-on-surface py-sm w-full bg-transparent" id="title" placeholder="Ex: Dune: Deuxième Partie" type="text">
</div>
<div class="grid grid-cols-2 gap-gutter">
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="duration">Durée (min)</label>
<input class="input-glass text-body-md font-body-md text-on-surface py-sm w-full bg-transparent" id="duration" placeholder="166" type="number">
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="genre">Genre</label>
<select class="input-glass text-body-md font-body-md text-on-surface py-sm w-full bg-transparent appearance-none" id="genre">
<option class="bg-surface-container" disabled="" selected="" value="">Sélectionner</option>
<option class="bg-surface-container" value="action">Action</option>
<option class="bg-surface-container" value="scifi">Science-Fiction</option>
<option class="bg-surface-container" value="drama">Drame</option>
<option class="bg-surface-container" value="thriller">Thriller</option>
</select>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="synopsis">Synopsis</label>
<textarea class="input-glass text-body-md font-body-md text-on-surface py-sm w-full bg-transparent resize-none" id="synopsis" placeholder="Description du film..." rows="4"></textarea>
</div>
</div>
</div>
<!-- Schedule Section -->
<div class="glass-panel p-md md:p-lg rounded-xl flex flex-col gap-md">
<div class="flex items-center gap-sm border-b border-white/5 pb-sm">
<span class="material-symbols-outlined text-primary" data-icon="schedule">schedule</span>
<h2 class="text-headline-sm font-headline-sm text-on-surface">Séances régulières</h2>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">Sélectionnez les horaires de projection par défaut pour ce film.</p>
<div class="flex flex-wrap gap-sm mt-sm">
<!-- Chip 1 -->
<div class="relative">
<input class="chip-checkbox sr-only" id="time-1" type="checkbox">
<label class="cursor-pointer inline-flex items-center justify-center px-lg py-sm rounded-lg bg-[#1A1A1A] border border-white/5 text-body-md font-body-md text-on-surface transition-colors hover:bg-white/5" for="time-1">
                            18:00
                        </label>
</div>
<!-- Chip 2 -->
<div class="relative">
<input checked="" class="chip-checkbox sr-only" id="time-2" type="checkbox">
<label class="cursor-pointer inline-flex items-center justify-center px-lg py-sm rounded-lg bg-[#1A1A1A] border border-white/5 text-body-md font-body-md text-on-surface transition-colors hover:bg-white/5" for="time-2">
                            20:30
                        </label>
</div>
<!-- Chip 3 -->
<div class="relative">
<input class="chip-checkbox sr-only" id="time-3" type="checkbox">
<label class="cursor-pointer inline-flex items-center justify-center px-lg py-sm rounded-lg bg-[#1A1A1A] border border-white/5 text-body-md font-body-md text-on-surface transition-colors hover:bg-white/5" for="time-3">
                            22:30
                        </label>
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin bg-gradient-to-t from-background via-background/90 to-transparent z-40 flex justify-center pb-safe">
<button class="w-full max-w-md bg-primary-container text-white text-body-lg font-body-lg font-bold py-md rounded-full floating-btn-shadow hover:bg-primary-container/90 active:scale-95 transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="save">save</span>
            Enregistrer le film
        </button>
</div>
</body></html>
