<style>
        .ticket-perforation {
            background-image: radial-gradient(circle at 10px 10px, transparent 10px, #1A1A1A 11px);
            background-size: 24px 24px;
            background-position: -2px -2px;
        }
        .ticket-perforation-top {
            background-image: radial-gradient(circle at 12px -2px, transparent 12px, #1c1b1b 13px);
            background-size: 24px 24px;
            background-position: center bottom;
        }
        .ticket-perforation-bottom {
            background-image: radial-gradient(circle at 12px 26px, transparent 12px, #1c1b1b 13px);
            background-size: 24px 24px;
            background-position: center top;
        }
        .bg-level-1 { background-color: #1A1A1A; }
    </style>

<body class="bg-background text-on-surface font-body-md h-screen flex flex-col pt-[80px] pb-[80px] md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-xl dark:bg-surface/80 fixed top-0 w-full z-50 border-b border-white/5 shadow-2xl flex items-center justify-between px-margin py-sm w-full">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-sm">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-on-surface dark:text-on-surface text-center flex-1">Cinéma Avenida</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-sm">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-margin py-xl flex flex-col items-center justify-center">
<div class="w-full max-w-sm relative">
<!-- Ticket Container -->
<div class="relative bg-level-1 rounded-xl shadow-2xl border border-white/5 flex flex-col overflow-hidden">
<!-- Top Perforation -->
<div class="h-6 w-full ticket-perforation-top absolute top-0 left-0"></div>
<!-- Ticket Header -->
<div class="pt-10 pb-6 px-lg text-center bg-surface-container-low border-b border-white/10 relative z-10">
<p class="font-label-md text-label-md text-primary uppercase tracking-widest mb-2">Cinéma Avenida</p>
<h2 class="font-display-lg text-display-lg text-on-surface leading-tight">Dune: Part Two</h2>
</div>
<!-- Ticket Details -->
<div class="p-lg flex flex-col gap-lg bg-surface-container-low relative z-10">
<div class="flex justify-between items-center border-b border-white/10 pb-md">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">DATE</p>
<p class="font-body-lg text-body-lg font-medium">Ven. 15 Nov</p>
</div>
<div class="text-right">
<p class="font-label-md text-label-md text-on-surface-variant mb-1">HEURE</p>
<p class="font-body-lg text-body-lg font-medium">20:30</p>
</div>
</div>
<div class="flex justify-between items-center border-b border-white/10 pb-md">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">SALLE</p>
<p class="font-headline-md text-headline-md text-primary">Salle 1</p>
</div>
<div class="text-right">
<p class="font-label-md text-label-md text-on-surface-variant mb-1">ZONE</p>
<p class="font-body-lg text-body-lg font-medium">Normal</p>
</div>
</div>
<div class="flex justify-center items-center py-sm">
<div class="text-center">
<p class="font-label-md text-label-md text-on-surface-variant mb-2">SIÈGES</p>
<div class="flex gap-md">
<span class="bg-surface-container-high px-4 py-2 rounded-lg font-headline-sm text-headline-sm border border-white/10">E5</span>
<span class="bg-surface-container-high px-4 py-2 rounded-lg font-headline-sm text-headline-sm border border-white/10">E6</span>
</div>
</div>
</div>
</div>
<!-- QR Code Section -->
<div class="bg-surface-container-low p-lg pt-0 flex flex-col items-center justify-center relative z-10">
<div class="bg-white p-4 rounded-lg shadow-inner mb-4">
<!-- Placeholder for QR Code, using a simple geometric pattern instead of an image to save HTML size per instructions -->
<div class="w-48 h-48 bg-black grid grid-cols-5 grid-rows-5 gap-1 p-2">
<div class="bg-white col-span-2 row-span-2"></div>
<div class="bg-black"></div>
<div class="bg-white col-span-2 row-span-2"></div>
<div class="bg-white row-start-4 col-span-2 row-span-2"></div>
<div class="bg-white col-start-4 row-start-4"></div>
<div class="bg-white col-start-5 row-start-5"></div>
<div class="bg-white col-start-3 row-start-3"></div>
</div>
</div>
<p class="font-label-md text-label-md text-on-surface-variant text-center">Présentez ce code à l'entrée</p>
</div>
<!-- Bottom Perforation -->
<div class="h-6 w-full ticket-perforation-bottom absolute bottom-0 left-0"></div>
</div>
<!-- Glow Effect -->
<div class="absolute inset-0 bg-primary/5 blur-3xl -z-10 rounded-full"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/80 backdrop-blur-xl dark:bg-surface/80 fixed bottom-0 w-full z-50 border-t border-white/5 shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex justify-around items-center h-16 px-margin pb-safe md:hidden">

<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
<span class="text-label-md font-label-md">Accueil</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-bold hover:text-primary/80 transition-colors active:scale-90 transition-transform w-full h-full">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="confirmation_number" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="text-label-md font-label-md">Mes Billets</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90 transition-transform w-full h-full">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
<span class="text-label-md font-label-md">Profil</span>
</button>
</nav>
